server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the orchestrator API (same-origin from the browser's POV).
  location /api/ {
    proxy_pass http://orchestrator:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
  }
  location /health {
    proxy_pass http://orchestrator:4000/health;
  }

  # PWA: never cache the service worker or manifest; SPA fallback for routes.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
